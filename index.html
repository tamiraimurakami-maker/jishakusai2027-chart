<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>理想のチームをさがせ！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: 方眼の夜空に浮かぶYes/Noチャート盤面。行き先は伏せたまま道だけが光り、発表→深掘り→納得→応募の順に1枚ずつ開示する。単一ダークテーマ（意図的） */
:root{
  --ink:#0A0F1F;
  --panel:#111A35;
  --panel-2:#16224A;
  --line:#2A3A6E;
  --blue:#4A8BF5;
  --pink:#FF2D87;
  --yellow:#FFE45C;
  --text:#EEF2FF;
  --muted:#9AA6CC;
  --grid:rgba(74,139,245,.09);
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink)}
body{
  margin:0;color:var(--text);font-family:var(--body);font-size:15px;line-height:1.75;
  background-color:var(--ink);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    radial-gradient(1200px 600px at 80% -10%,rgba(255,45,135,.16),transparent 60%),
    radial-gradient(900px 500px at -10% 30%,rgba(74,139,245,.18),transparent 60%);
  background-size:28px 28px,28px 28px,auto,auto;
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden;
}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 64px}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
h1,h2,h3{text-wrap:balance;margin:0}

/* ---------- top bar ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;min-height:30px}
.brand{font-family:var(--display);font-size:13px;letter-spacing:.08em;color:var(--muted)}
.brand b{color:var(--text);font-weight:400}
.deadline{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--yellow);color:var(--yellow);
  border-radius:999px;padding:4px 14px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.deadline .dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);box-shadow:0 0 10px var(--yellow)}

/* ---------- intro ---------- */
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:36px;align-items:center}
.eyebrow{display:inline-block;background:var(--pink);color:#fff;font-family:var(--display);font-size:13px;
  padding:3px 12px;border-radius:6px;transform:rotate(-3deg);letter-spacing:.06em;box-shadow:0 0 18px rgba(255,45,135,.5)}
.intro h1{font-family:var(--display);font-weight:400;font-size:clamp(36px,5.2vw,68px);line-height:1.12;margin:14px 0 14px;letter-spacing:.01em}
.intro h1 .nw{white-space:nowrap}
.intro h1 .y{color:var(--yellow);text-shadow:0 0 24px rgba(255,228,92,.35)}
.lead{color:#D5DBF5;font-size:16px;max-width:30em;margin:0 0 22px}
.meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:24px}
.meta b{color:var(--text);font-size:15px}
.cta-start{background:var(--pink);color:#fff;border:0;border-radius:14px;font-family:var(--display);font-size:22px;
  padding:16px 34px;box-shadow:0 6px 0 #a3104f,0 0 30px rgba(255,45,135,.45);transition:transform .12s}
.cta-start:hover{transform:translateY(-2px)}
.cta-start:active{transform:translateY(3px);box-shadow:0 3px 0 #a3104f}
.facts{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.fact{border-left:3px solid var(--blue);padding:2px 0 2px 10px;font-size:12px;color:var(--muted);line-height:1.5}
.fact b{display:block;font-family:var(--display);font-weight:400;font-size:20px;color:var(--text);font-variant-numeric:tabular-nums}

/* ---------- board ---------- */
.board{position:relative;background:linear-gradient(180deg,rgba(17,26,53,.85),rgba(10,15,31,.85));
  border:1px solid var(--line);border-radius:18px;padding:12px;min-width:0}
.board svg{display:block;width:100%;height:auto}
.legend{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:6px 6px 0}
.legend span b{color:var(--pink)}
.n circle{fill:#0E1630;stroke:var(--line);stroke-width:2.5;transition:all .35s}
.n text{fill:var(--muted);font-family:var(--body);font-weight:700;font-size:13px;transition:fill .35s}
.n .qm{font-family:var(--display);font-size:22px;fill:var(--yellow);display:none}
.n.done circle{stroke:var(--pink);fill:#3a1033}
.n.done text{fill:#FFD0E4}
.n.cur circle{stroke:var(--yellow);fill:#2b2a12}
.n.cur text{fill:var(--yellow)}
.n.cur{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.07)}}
.e{stroke:var(--line);stroke-width:3;fill:none}
.e.lit{stroke:var(--pink);stroke-dasharray:200;stroke-dashoffset:200;animation:draw .45s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.t rect{fill:#13204a;stroke:var(--blue);stroke-width:2;transition:all .4s}
.t text{fill:#CFE0FF;font-family:var(--body);font-weight:900;font-size:15px}
.t .mk{font-family:var(--display);font-size:26px;fill:#5d74b8;display:none}
.t.win rect{fill:var(--pink);stroke:#fff}
.t.win text{fill:#fff}
.t.alt rect{stroke:var(--yellow);stroke-dasharray:5 4}
/* 伏せモード：質問のキーワードと行き先を隠す */
.masked .n .lbl{display:none}
.masked .n.cur .qm{display:block}
.masked .t .real{display:none}
.masked .t .mk{display:block}
.masked .t rect{fill:#0f1836;stroke:#33467f;stroke-dasharray:4 5}
/* 明かしモード：行き先が順に現れる */
.unveil .t{animation:pop .5s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
.unveil .t{transform-box:fill-box;transform-origin:center}

/* ---------- play ---------- */
.play{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 24px 22px;position:relative;overflow:hidden}
.qcard::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--blue),var(--pink))}
.qstep{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:700}
.qstep .tag{color:var(--yellow)}
.qtext{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.4vw,34px);line-height:1.35;margin:22px 0 26px;min-height:2.7em}
.qtext.in{animation:qin .35s ease-out}
@keyframes qin{from{opacity:.2;transform:translateY(8px)}}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{border-radius:14px;font-family:var(--display);font-size:24px;padding:16px 0;border:2px solid transparent;transition:transform .1s}
.ans:active{transform:scale(.97)}
.ans.yes{background:var(--pink);color:#fff;box-shadow:0 5px 0 #a3104f}
.ans.no{background:transparent;color:var(--text);border-color:#4B5C93;box-shadow:0 5px 0 #26335c}
.ans small{display:block;font-family:var(--body);font-size:11px;font-weight:700;opacity:.8;margin-top:-2px}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:12px;color:var(--muted)}
.link-btn{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px}
.link-btn:disabled{opacity:.35;cursor:default}
.hint{margin-top:14px;font-size:12px;color:var(--muted)}

/* ---------- reveal ---------- */
.reveal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:rgba(6,9,20,.95);text-align:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.reveal .pre{font-size:16px;color:var(--muted);letter-spacing:.1em;animation:fade .6s ease-out}
.reveal .team{font-family:var(--display);font-size:clamp(42px,10vw,104px);line-height:1.08;margin:10px 0 6px;
  color:#fff;text-shadow:0 0 30px rgba(255,45,135,.8),0 0 70px rgba(255,45,135,.45);opacity:0}
.reveal .team.sm{font-size:clamp(30px,7vw,64px);text-wrap:balance;word-break:keep-all;max-width:12em}
.reveal .team.go{animation:slam .55s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes slam{from{opacity:0;transform:scale(1.8)}to{opacity:1;transform:scale(1)}}
.reveal .en{font-family:var(--display);color:var(--yellow);letter-spacing:.3em;font-size:14px;opacity:0}
.reveal .catch{max-width:28em;color:#D5DBF5;margin:16px auto 26px;opacity:0;font-size:16px}
.reveal .go-fade{animation:fade .5s ease-out forwards}
.reveal .btns{display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.burst{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.burst i{position:absolute;width:8px;height:14px;top:-20px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- result (1枚ずつ) ---------- */
.result{max-width:760px;margin:0 auto}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps i{flex:1;height:5px;border-radius:3px;background:#22305c;transition:background .3s}
.steps i.on{background:var(--pink);box-shadow:0 0 8px rgba(255,45,135,.6)}
.slabel{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;margin-bottom:10px}
.slabel b{color:var(--yellow);font-weight:700}
.slide{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px 24px 26px;min-height:360px;animation:sin .4s ease-out}
@keyframes sin{from{opacity:0;transform:translateX(16px)}}
.slide h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,4.4vw,34px);line-height:1.3;margin-bottom:16px}
.slide p{margin:0 0 12px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}
.nav .next{background:var(--blue);color:#fff;border:0;border-radius:14px;font-family:var(--display);font-size:18px;padding:13px 28px;box-shadow:0 5px 0 #2b5db0}
.nav .next:active{transform:translateY(3px);box-shadow:0 2px 0 #2b5db0}
.hero-s{background:radial-gradient(600px 300px at 90% 0%,rgba(255,45,135,.35),transparent 70%),linear-gradient(160deg,#1A2758,#0E1530);border-color:#3a4b8a}
.hero-s .kicker{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.hero-s .tname{font-family:var(--display);font-weight:400;font-size:clamp(40px,8vw,76px);line-height:1.08;margin:6px 0 14px;text-shadow:0 0 30px rgba(255,45,135,.45)}
.type{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;background:var(--yellow);color:#1b1600;border-radius:10px;padding:8px 14px;
  font-weight:900;font-size:14px;transform:rotate(-1deg)}
.type b{font-family:var(--display);font-weight:400;font-size:21px}
.hero-s .catch{font-size:17px;font-weight:700;margin:20px 0 0}
.reason{font-size:18px;font-weight:700;line-height:1.85}
.reason em{font-style:normal;color:var(--yellow)}
.fit-head{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;margin-top:18px}
.fit{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.fit li::before{content:"✓";color:var(--yellow);font-weight:900;margin-right:8px}
.unitname{font-weight:900;color:var(--yellow);font-size:15px;margin-bottom:10px}
.jobs{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px;font-size:16px}
.desc{color:var(--muted);font-size:14px;margin-top:16px!important}
.big{font-family:var(--display);font-size:clamp(52px,11vw,88px);line-height:1;color:var(--yellow);font-variant-numeric:tabular-nums;
  text-shadow:0 0 26px rgba(255,228,92,.35);margin:10px 0 12px}
.big small{font-size:.34em;color:var(--text);margin-left:6px}
.stat-lab{font-weight:900;font-size:16px}
.stat-note{color:var(--muted);font-size:14px}
.voice{margin-top:20px;padding:14px 16px;border-radius:12px;background:var(--panel-2);font-size:15px;font-weight:700}
.voice span{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;margin-bottom:2px}
.route{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.route li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.55}
.yn{flex:none;font-family:var(--display);font-size:11px;border-radius:5px;padding:2px 7px;margin-top:2px;min-width:38px;text-align:center}
.yn.y{background:var(--pink);color:#fff}
.yn.n{border:1.5px solid #4B5C93;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid #3a4b8a;border-radius:999px;padding:4px 12px;font-size:13px;background:#0E1630}
.apply-s{background:linear-gradient(140deg,#ff2d87,#b5126a);border-color:#ff6aa9;box-shadow:0 0 40px rgba(255,45,135,.3)}
.apply-s .chip{background:rgba(0,0,0,.18);border-color:rgba(255,255,255,.35)}
.apply-s .fit-head{color:rgba(255,255,255,.8)}
.apply-btn{display:inline-block;margin-top:24px;background:var(--yellow);color:#1b1600;text-decoration:none;font-family:var(--display);font-size:22px;border-radius:14px;padding:15px 30px;
  box-shadow:0 5px 0 #a8901a}
.apply-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a8901a}
.dl{margin-top:14px;font-size:13px;font-variant-numeric:tabular-nums;font-weight:700}
.small{font-size:12px;opacity:.85}
.extra{display:flex;flex-direction:column;gap:22px}
.extra h3{font-family:var(--display);font-weight:400;font-size:18px;margin-bottom:8px}
.alt-name{font-family:var(--display);font-size:24px}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.unit{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#0E1630;font-size:13px;line-height:1.6}
.unit b{display:block;font-size:14px;margin-bottom:4px}
.unit.me{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset;background:#24112c}
.unit.me b::after{content:"あなた";margin-left:8px;font-size:10px;background:var(--pink);color:#fff;border-radius:4px;padding:1px 6px;vertical-align:2px}
.share textarea{width:100%;min-height:80px;resize:vertical;background:#0E1630;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;font-size:13px}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.btn{border-radius:12px;padding:11px 18px;font-weight:900;font-size:14px;border:1.5px solid #4B5C93;background:transparent;color:var(--text);text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.copied{font-size:12px;color:var(--yellow);min-height:1em;margin-top:6px}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
details.tc{background:#0E1630;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
details.tc[open]{border-color:var(--blue)}
details.tc.me{border-color:var(--pink)}
details.tc summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:2px}
details.tc summary::-webkit-details-marker{display:none}
details.tc summary b{font-family:var(--display);font-weight:400;font-size:17px}
details.tc summary span{font-size:12px;color:var(--muted);line-height:1.5}
details.tc .body{margin-top:10px;font-size:13px;line-height:1.65;color:#D5DBF5}
details.tc .body ul{margin:6px 0 0;padding-left:1.1em}
hr.sep{border:0;border-top:1px dashed var(--line);margin:0}
.foot{margin-top:40px;font-size:12px;color:var(--muted);text-align:center;line-height:1.8}

[hidden]{display:none!important}
@media (max-width:860px){
  .intro,.play{grid-template-columns:minmax(0,1fr)}
  .intro{gap:22px}
  .play{gap:14px}
  .qcard{padding:22px 18px 18px}
  .qtext{margin:16px 0 20px}
  .slide{padding:22px 18px;min-height:0}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
  .e.lit{stroke-dashoffset:0}
  .reveal .team,.reveal .en,.reveal .catch,.reveal .btns{opacity:1}
}
</style>
</head>
<body>


<div class="wrap">
  <div class="topbar">
    <div class="brand"><b>磁石祭製作委員会2027</b>　Yes/Noチャート</div>
    <div class="deadline" id="deadline"><span class="dot"></span><span id="dl-text">応募締切 11/2（月）11:59</span></div>
  </div>

  <!-- INTRO -->
  <section id="intro" class="intro">
    <div>
      <span class="eyebrow">START!</span>
      <h1><span class="nw">理想のチームを</span><br><span class="y nw">さがせ！</span></h1>
      <p class="lead">磁石祭をつくるチームの中で、あなたが一番輝けるのはどこ？ 直感でYESかNOを選んでいくだけ。行き先は、最後まで秘密です。</p>
      <div class="meta"><span><b>約1分</b>　で終わる</span><span><b>3〜9問</b>　答えで変わる</span></div>
      <button class="cta-start" id="startBtn">診断スタート</button>
      <div class="facts">
        <div class="fact"><b>約19万人</b>磁石祭2026 ニコニコ生放送の来場者</div>
        <div class="fact"><b>1,545万円</b>51社からの企業協賛</div>
      </div>
    </div>
    <div class="board" id="introBoard"></div>
  </section>

  <!-- PLAY -->
  <section id="play" class="play" hidden>
    <div class="board" id="playBoard"></div>
    <div class="qcard">
      <div class="qstep"><span id="qPhase">STEP 1</span><span class="tag" id="qCount">Q1</span></div>
      <h2 class="qtext" id="qText"></h2>
      <div class="answers">
        <button class="ans yes" id="yesBtn">YES<small>あてはまる</small></button>
        <button class="ans no" id="noBtn">NO<small>ちがうかも</small></button>
      </div>
      <div class="qfoot">
        <button class="link-btn" id="backBtn">← ひとつ戻る</button>
        <button class="link-btn" id="resetBtn">トップへ戻る</button>
      </div>
      <div class="hint" id="qHint">深く考えすぎず、直感で選んでOK。</div>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="result" hidden>
    <div class="steps" id="steps"></div>
    <div class="slabel"><span id="sName"></span><span style="display:flex;gap:12px;align-items:center"><button class="link-btn" id="restartBtn" style="font-size:12px;padding:0">最初からやり直す</button><b id="sNum"></b></span></div>
    <div id="slideBox"></div>
    <div class="nav">
      <button class="link-btn" id="prevBtn">← 戻る</button>
      <button class="next" id="nextBtn">次へ</button>
    </div>
  </section>

  <p class="foot">磁石祭2027の情報は Slack の #磁石祭2027_お知らせ で発信中。<br>質問は #磁石祭2027_問い合わせ へ。</p>
</div>

<div class="reveal" id="reveal" hidden>
  <div class="burst" id="burst"></div>
  <div class="pre" id="rvPre"></div>
  <div class="en" id="rvEn"></div>
  <div class="team" id="rvTeam"></div>
  <p class="catch" id="rvCatch"></p>
  <div class="btns" id="rvBtns">
    <button class="cta-start" id="rvNext"></button>
    <span style="font-size:12px;color:var(--muted)" id="rvNote"></span>
    <button class="link-btn" id="rvBack" style="margin-top:6px">← 答えを直す</button>
  </div>
</div>

<script>
(function(){
"use strict";
/* ===== 設定 ===== */

    o+='<path class="e" data-e="'+r+'-'+c+'-n" d="M'+x+' '+(y+R+4)+'V'+vy2+'"/>';
  }
  for(r=0;r<3;r++)for(c=0;c<5;c++){
    o+='<g class="n" data-n="'+r+'-'+c+'"><circle cx="'+CX[c]+'" cy="'+RY[r]+'" r="'+R+'"/>'+tlines(Q[r][c].l,CX[c],RY[r],"lbl")+
       '<text class="qm" x="'+CX[c]+'" y="'+(RY[r]+8)+'" text-anchor="middle">?</text></g>';
  }
  var k=0;
  RIGHT.forEach(function(key,i){
    var y=RY[i];
    o+='<g class="t" data-t="'+key+'" style="animation-delay:'+(k++*0.12)+'s"><rect x="'+TX+'" y="'+(y-46)+'" width="'+TW+'" height="92" rx="12"/>'+tlines(T[key].label,TX+TW/2,y,"real")+
       '<text class="mk" x="'+(TX+TW/2)+'" y="'+(y+9)+'" text-anchor="middle">？</text></g>';
  });
  BOTTOM.forEach(function(key,i){
    var x=CX[i];
    o+='<g class="t" data-t="'+key+'" style="animation-delay:'+(k++*0.12)+'s"><rect x="'+(x-BW/2)+'" y="'+BY+'" width="'+BW+'" height="'+BH+'" rx="12"/>'+tlines(T[key].label,x,BY+BH/2,"real")+
       '<text class="mk" x="'+x+'" y="'+(BY+BH/2+9)+'" text-anchor="middle">？</text></g>';
  });
  o+='</svg><div class="legend"><span><b>→</b> YES　<span style="color:#9AA6CC">↓</span> NO</span><span>磁石祭製作委員会2027 Yes/Noチャート</span></div>';
  return o;
}
function mountBoard(el,id,masked){
  el.innerHTML=boardSVG(id);
  el.classList.toggle("masked",!!masked);
  el.querySelectorAll(".e").forEach(function(p){p.style.markerEnd="url(#arrDim"+id+")";});
}
function paint(el,id,st){
  el.querySelectorAll(".n").forEach(function(g){g.classList.remove("done","cur");g.querySelector("circle").style.filter="";});
  el.querySelectorAll(".e").forEach(function(p){
    var lit=st.edges.indexOf(p.getAttribute("data-e"))>=0;
    if(lit&&!p.classList.contains("lit")){p.classList.add("lit");p.style.markerEnd="url(#arrLit"+id+")";p.style.filter="url(#glowP"+id+")";}
    if(!lit&&p.classList.contains("lit")){p.classList.remove("lit");p.style.markerEnd="url(#arrDim"+id+")";p.style.filter="";}
  });
  st.done.forEach(function(k){var g=el.querySelector('[data-n="'+k+'"]');if(g)g.classList.add("done");});
  if(st.cur){var g=el.querySelector('[data-n="'+st.cur+'"]');if(g){g.classList.add("cur");g.querySelector("circle").style.filter="url(#glowY"+id+")";}}
  el.querySelectorAll(".t").forEach(function(g){
    var k=g.getAttribute("data-t");
    g.classList.toggle("win",k===st.win);
    g.classList.toggle("alt",k===st.alt);
    g.querySelector("rect").style.filter=(k===st.win)?"url(#glowP"+id+")":"";
  });
}

/* ===== 状態 ===== */
var S={pos:{r:0,c:0},hist:[],team:null,node:null,sub:[],unit:null,slide:0};
var $=function(id){return document.getElementById(id);};
var introB=$("introBoard"), playB=$("playBoard");
mountBoard(introB,"a",true);
mountBoard(playB,"b",true);

function boardState(){
  return {
    edges:S.hist.map(function(h){return h.r+"-"+h.c+"-"+(h.a?"y":"n");}),
    done:S.hist.map(function(h){return h.r+"-"+h.c;}),
    cur:S.team?null:(S.pos.r+"-"+S.pos.c),win:null,alt:null};
}
function show(id){
  ["intro","play","result"].forEach(function(s){$(s).hidden=(s!==id);});
  $("deadline").hidden=(id==="play"||id==="result");
}

function renderQ(){
  var qt=$("qText");
  if(!S.team){
    $("qPhase").textContent="STEP 1｜あなたの行き先をさがす";
    $("qCount").textContent="Q"+(S.hist.length+1);
    qt.textContent=Q[S.pos.r][S.pos.c].t;
    $("qHint").textContent="深く考えすぎず、直感で選んでOK。";
  }else{
    $("qPhase").textContent="STEP 2｜"+T[S.team].name+"の中で、もっと深く";
    $("qCount").textContent="Q"+(S.hist.length+S.sub.length+1);
    qt.textContent=S.node.q;
    $("qHint").textContent="チームの中で、あなたが一番輝ける場所をしぼりこんでいます。";
  }
  qt.classList.remove("in");void qt.offsetWidth;qt.classList.add("in");
  $("backBtn").disabled=(S.hist.length===0&&!S.team);
  var st=boardState(); if(S.team){st.win=null;}
  paint(playB,"b",st);
}

function answer(a){
  if(!S.team){
    var r=S.pos.r,c=S.pos.c;
    S.hist.push({r:r,c:c,a:a});
    if(a){ if(c===4){finishLattice(RIGHT[r]);return;} S.pos={r:r,c:c+1}; }
    else { if(r===2){finishLattice(BOTTOM[c]);return;} S.pos={r:r+1,c:c}; }
    renderQ();
  }else{
    var nxt=a?S.node.y:S.node.n;
    S.sub.push({q:S.node.q,a:a,node:S.node});
    if(typeof nxt==="string"){S.unit=nxt;revealUnit();}
    else{S.node=nxt;renderQ();}
  }
}
function back(){
  if(S.team){
    if(S.sub.length){var last=S.sub.pop();S.node=last.node;renderQ();return;}
    S.team=null;S.node=null;
  }
  if(!S.hist.length)return;
  var h=S.hist.pop();S.pos={r:h.r,c:h.c};renderQ();
}
function reset(toIntro){
  S={pos:{r:0,c:0},hist:[],team:null,node:null,sub:[],unit:null,slide:0};
  if(toIntro){show("intro");window.scrollTo(0,0);return;}
  show("play");renderQ();window.scrollTo(0,0);
}

/* ===== 発表演出 ===== */
var RM=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(){
  if(RM)return;
  var b=$("burst");b.innerHTML="";
  var cols=["#FF2D87","#FFE45C","#4A8BF5","#ffffff"];
  for(var i=0;i<70;i++){
    var e=document.createElement("i");
    e.style.left=(Math.random()*100)+"%";
    e.style.background=cols[i%4];
    e.style.animationDuration=(1.6+Math.random()*1.8)+"s";
    e.style.animationDelay=(Math.random()*.5)+"s";
    b.appendChild(e);
  }
}
var rvAction=null;
function runReveal(o){
  var tm=$("rvTeam"),en=$("rvEn"),ca=$("rvCatch"),bt=$("rvBtns");
  [tm,en,ca,bt].forEach(function(e){e.classList.remove("go","go-fade");e.style.animationDelay="";});
  $("burst").innerHTML="";
  $("rvPre").textContent=o.pre; en.textContent=o.en; tm.textContent=o.title; ca.textContent=o.sub;
  tm.classList.toggle("sm",!!o.small);
  $("rvNext").textContent=o.btn; $("rvNote").textContent=o.note||"";
  rvAction=o.action;
  $("reveal").hidden=false;
  var d=RM?0:1300;
  setTimeout(function(){tm.classList.add("go");en.classList.add("go-fade");confetti();},d);
  setTimeout(function(){ca.classList.add("go-fade");},d+500);
  /* チーム名の余韻を残してから、次のボタンを出す */
  setTimeout(function(){bt.classList.add("go-fade");$("rvNext").focus({preventScroll:true});},RM?0:d+1900);
}
function finishLattice(team){
  S.team=team;
  var t=T[team];
  S.node=(typeof t.tree==="string")?null:t.tree;
  paint(playB,"b",boardState());
  runReveal({pre:"あなたが一番輝けるチームは……",en:t.en,title:t.name,sub:t.catch,
    btn:S.node?"もっと深く診断する":"あなたの結果を見る",
    note:S.node?"チームの中の、あなたの居場所を見つけます":"2027年度に生まれた、いちばん新しいチームです",
    action:function(){
      if(S.node){renderQ();window.scrollTo(0,0);}
      else{S.unit=t.tree;startResult();}
    }});
}
function revealUnit(){
  var t=T[S.team],u=t.units[S.unit];
  runReveal({pre:t.name+"の中で、あなたは……",en:u.name,title:u.nick,sub:"あなたにぴったりの役割が見つかりました。",small:true,
    btn:"あなたの結果を見る",note:"",action:startResult});
}
$("rvNext").addEventListener("click",function(){$("reveal").hidden=true;if(rvAction)rvAction();});
/* 最後の答えを取り消して、質問に戻る（発表画面・結果1枚目から） */
function undoLast(){
  $("reveal").hidden=true;
  S.unit=null;
  if(S.sub.length){var l=S.sub.pop();S.node=l.node;}
  else{S.team=null;S.node=null;var h=S.hist.pop();if(h)S.pos={r:h.r,c:h.c};}
  show("play");renderQ();window.scrollTo(0,0);
}
$("rvBack").addEventListener("click",undoLast);
$("restartBtn").addEventListener("click",function(){reset(false);});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("reveal").hidden)undoLast();});

/* ===== 結果（1枚ずつ開示） ===== */
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];});}
function li(arr){return arr.map(function(x){return "<li>"+esc(x)+"</li>";}).join("");}
function deadlineText(){
  var ms=DEADLINE-new Date();
  if(ms<=0)return {open:false,txt:"応募は締め切りました"};
  var d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
  return {open:true,txt:"締切 11/2（月）11:59まで あと"+(d>0?d+"日":"")+h+"時間"+(d>0?"":m+"分")};
}
function reasonText(){
  var t=T[S.team],u=t.units[S.unit];
  var yes=S.hist.filter(function(h){return h.a;}).map(function(h){return Q[h.r][h.c].tr;});
  var picks=yes.slice(-3);
  if(!picks.length){
    return "あなたは、目立つ場所に飛び込むより、自分の手で確かなものを形にしたい人。その力が一番生きるのが、<em>"+esc(t.name)+"</em>の<em>"+esc(u.name)+"</em>です。";
  }
  return "あなたの答えから見えたのは、"+picks.map(function(p){return "<em>"+esc(p)+"</em>";}).join("、")+"。その力が一番生きるのが、"+esc(t.name)+"の<em>"+esc(u.name)+"</em>です。";
}
var SLIDES=[
 {k:"hero",n:"結果"},
 {k:"why",n:"向いている理由"},
 {k:"job",n:"あなたの仕事"},
 {k:"stat",n:"このチームの実績"},
 {k:"route",n:"あなたが通ってきた道"},
 {k:"apply",n:"応募する"},
 {k:"more",n:"もっと知る"}
];
function slideHTML(k){
  var t=T[S.team],u=t.units[S.unit],multi=Object.keys(t.units).length>1;
  if(k==="hero") return '<div class="slide hero-s"><div class="kicker">あなたに向いているチームは</div><div class="tname">'+esc(t.name)+'</div>'+
    '<div class="type"><b>'+esc(u.nick)+'</b><span>'+esc(u.name)+(multi?" タイプ":"")+'</span></div><p class="catch">'+esc(t.catch)+'</p></div>';
  if(k==="why") return '<div class="slide"><h2>なぜ、'+esc(t.name)+'なのか</h2><p class="reason">'+reasonText()+'</p>'+
    '<div class="fit-head">'+esc(t.name)+'に向いているのは</div><ul class="fit">'+li(t.fit)+'</ul></div>';
  if(k==="job") return '<div class="slide"><h2>あなたがやること</h2><div class="unitname">'+esc(u.name)+'</div><ul class="jobs">'+li(u.jobs)+'</ul><p class="desc">'+esc(t.desc)+'</p></div>';
  if(k==="stat"){var num=t.stat.raw?String(t.stat.n):t.stat.n.toLocaleString("ja-JP");
    return '<div class="slide"><h2>'+esc(t.name)+'がつくったもの</h2><div class="big"><span id="countUp" data-n="'+t.stat.n+'" data-raw="'+(t.stat.raw?1:0)+'">'+num+'</span><small>'+esc(t.stat.u)+'</small></div>'+
    '<div class="stat-lab">'+esc(t.stat.lab)+'</div><div class="stat-note">'+esc(t.stat.note)+'</div>'+
    (t.voice?'<div class="voice"><span>'+esc(t.voice.k)+'</span>'+esc(t.voice.v)+'</div>':'')+'</div>';}
  if(k==="route"){
    var route=S.hist.map(function(h){return {q:Q[h.r][h.c].t,a:h.a};}).concat(S.sub.map(function(s){return {q:s.q,a:s.a};}));
    return '<div class="slide"><h2>あなたが通ってきた道</h2><p style="color:var(--muted);font-size:14px">伏せていた行き先を明かします。'+route.length+'回の選択が、ここにつながりました。</p>'+
    '<div class="board" id="resBoard" style="padding:6px;border:0;background:none"></div>'+
    '<ul class="route">'+route.map(function(x){return '<li><span class="yn '+(x.a?"y":"n")+'">'+(x.a?"YES":"NO")+'</span><span>'+esc(x.q)+'</span></li>';}).join("")+'</ul></div>';}
  if(k==="apply"){var dl=deadlineText();
    return '<div class="slide apply-s"><h2>'+(dl.open?"このチームで、<br>日本一の文化祭をつくろう。":"今年の募集は締め切りました")+'</h2>'+
    '<div class="fit-head">今年はこんなことに挑戦！</div><div class="chips">'+t.challenge.map(function(x){return '<span class="chip">'+esc(x)+'</span>';}).join("")+'</div>'+
    (t.skills.length?'<div class="fit-head" style="margin-top:14px">身につく力</div><div class="chips">'+t.skills.map(function(x){return '<span class="chip">'+esc(x)+'</span>';}).join("")+'</div>':'')+
    (dl.open?'<a class="apply-btn" href="'+APPLY_URL+'" target="_blank" rel="noopener">応募フォームへ</a>':'')+
    '<div class="dl" id="applyDl">'+esc(dl.txt)+'</div><div class="small">応募には生徒用Googleアカウントでのログインが必要です。第1希望の参考に、診断結果を使ってください。</div></div>';}
  if(k==="more"){var alt=T[NEXT[S.team]];
    var shareTxt="磁石祭製作委員会2027のYes/Noチャートをやってみたら、「"+t.name+"｜"+u.nick+"」だった！ 一緒に応募しない？ 応募締切は11/2（月）11:59";
    var sendBtn=RESULT_FORM_URL?'<a class="btn pri" target="_blank" rel="noopener" href="'+esc(RESULT_FORM_URL.replace("{team}",encodeURIComponent(t.name)).replace("{unit}",encodeURIComponent(u.name)))+'">診断結果を送る</a>':"";
    return '<div class="slide extra">'+
     '<div><h3>もう一つの可能性</h3><div class="alt-name">'+esc(alt.name)+'</div><p style="color:var(--muted);font-size:13px;margin:4px 0 0">最後の分かれ道で逆を選ぶと、このチームの方向へ進んでいました。第2希望を考えるときの参考に。</p></div><hr class="sep">'+
     (multi?'<div><h3>'+esc(t.name)+'の班</h3><div class="units">'+Object.keys(t.units).map(function(x){var v=t.units[x];return '<div class="unit'+(x===S.unit?' me':'')+'"><b>'+esc(v.name)+'</b>'+esc(v.jobs[0])+'</div>';}).join("")+'</div></div><hr class="sep">':'')+
     '<div class="share"><h3>友達を誘う</h3><p style="margin:0;color:var(--muted);font-size:13px">一緒に応募できる仲間がいると心強い。結果をコピーして送ってみよう。</p><textarea id="shareTxt" readonly>'+esc(shareTxt)+'</textarea>'+
     '<div class="row-btns"><button class="btn pri" id="copyBtn">結果をコピー</button>'+sendBtn+'</div><div class="copied" id="copied"></div></div><hr class="sep">'+
     '<div><h3>ほかのチームも見る</h3><div class="tlist">'+ORDER.map(function(key){var x=T[key];
        return '<details class="tc'+(key===S.team?' me':'')+'"><summary><b>'+esc(x.name)+'</b><span>'+esc(x.catch)+'</span></summary><div class="body">'+esc(x.desc)+
        '<ul>'+Object.keys(x.units).map(function(z){return "<li>"+esc(x.units[z].name)+"</li>";}).join("")+'</ul></div></details>';}).join("")+'</div></div><hr class="sep">'+
     '<div><h3>もう一度やる</h3><p style="margin:0;color:var(--muted);font-size:13px">答えを変えると、ちがうチームが見えてきます。</p><div class="row-btns"><button class="btn pri" id="againBtn">もう一回診断する</button><button class="btn" id="topBtn">トップへ戻る</button></div></div>'+
    '</div>';}
}
var ORDER=["stage","studio","booth","online","pr","creative","prepost","obog"];
function startResult(){S.slide=0;show("result");renderSlide();}
function renderSlide(){
  var s=SLIDES[S.slide];
  $("steps").innerHTML=SLIDES.map(function(_,i){return '<i class="'+(i<=S.slide?"on":"")+'"></i>';}).join("");
  $("sName").textContent=s.n; $("sNum").textContent=(S.slide+1)+" / "+SLIDES.length;
  $("slideBox").innerHTML=slideHTML(s.k);
  $("prevBtn").textContent=S.slide===0?"← 答えを直す":"← 戻る";
  $("nextBtn").hidden=(S.slide===SLIDES.length-1);
  $("nextBtn").textContent=S.slide===SLIDES.length-2?"もっと知る":"次へ";
  if(s.k==="stat")countUp();
  if(s.k==="route"){
    var rb=$("resBoard");mountBoard(rb,"c",true);
    var st=boardState();st.cur=null;paint(rb,"c",st);
    setTimeout(function(){rb.classList.remove("masked");rb.classList.add("unveil");
      var st2=boardState();st2.cur=null;st2.win=S.team;paint(rb,"c",st2);},RM?0:700);
  }
  if(s.k==="more"){
    $("copyBtn").addEventListener("click",copyShare);
    $("againBtn").addEventListener("click",function(){reset(false);});
    $("topBtn").addEventListener("click",function(){reset(true);});
  }
  window.scrollTo(0,0);
}
$("nextBtn").addEventListener("click",function(){if(S.slide<SLIDES.length-1){S.slide++;renderSlide();}});
$("prevBtn").addEventListener("click",function(){if(S.slide>0){S.slide--;renderSlide();}else{undoLast();}});
function countUp(){
  var el=$("countUp");if(!el||RM)return;
  var n=+el.getAttribute("data-n"),raw=el.getAttribute("data-raw")==="1",t0=null,D=1400;
  function step(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/D),v=Math.round(n*(1-Math.pow(1-p,3)));
    el.textContent=raw?String(v):v.toLocaleString("ja-JP");if(p<1)requestAnimationFrame(step);}
  el.textContent="0";requestAnimationFrame(step);
}
function copyShare(){
  var ta=$("shareTxt"),msg=$("copied");
  function fallback(){ta.focus();ta.select();try{var ok=document.execCommand("copy");msg.textContent=ok?"コピーしました":"テキストを長押し（または選択）してコピーしてください";}catch(e){msg.textContent="テキストを長押し（または選択）してコピーしてください";}}
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(function(){msg.textContent="コピーしました";},fallback);
    }else fallback();
  }catch(e){fallback();}
}

/* ===== 締切表示 ===== */
function tick(){
  var d=deadlineText();
  $("dl-text").textContent=d.open?d.txt:"応募は締め切りました";
  var a=$("applyDl");if(a)a.textContent=d.txt;
}
tick();setInterval(tick,30000);

/* ===== 操作 ===== */
$("startBtn").addEventListener("click",function(){reset(false);});
$("yesBtn").addEventListener("click",function(){answer(true);});
$("noBtn").addEventListener("click",function(){answer(false);});
$("backBtn").addEventListener("click",back);
$("resetBtn").addEventListener("click",function(){reset(true);});
document.addEventListener("keydown",function(e){
  if($("play").hidden||!$("reveal").hidden)return;
  if(e.key==="y"||e.key==="Y"||e.key==="ArrowRight")answer(true);
  if(e.key==="n"||e.key==="N"||e.key==="ArrowDown")answer(false);
});
paint(introB,"a",{edges:[],done:[],cur:"0-0",win:null,alt:null});
})();
</script>
